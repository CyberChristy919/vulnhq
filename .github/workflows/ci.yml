# Runs the backend tests and frontend checks on every pull request and every push to main
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only access to the code is all these jobs need
permissions:
  contents: read

# A new push to the same branch cancels the run that's still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install packages
        run: pip install -r requirements.txt

      # Tests use SQLite and a fake AI model, so no PostgreSQL or Ollama is needed
      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend tests, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
